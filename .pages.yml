# Configuration de l'interface d'édition Pages CMS (app.pagescms.org)
media:
  input: images
  output: /images

content:
  - name: articles
    label: Articles
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date de publication
        type: date
      - name: a_la_une
        label: "À la une (mettre en avant en haut de l'accueil — sinon la dernière analyse est affichée automatiquement)"
        type: boolean
      - name: rubrique
        label: Rubrique
        type: select
        options:
          values:
            - name: jurisprudence
              label: Analyse de jurisprudence
            - name: fiche
              label: Fiche pratique
            - name: revue_presse
              label: Revue de presse
            - name: actualite
              label: Actualité
      - name: categorie
        label: Thème (ex. Pharma · CCP)
        type: string
      - name: juridiction
        label: "Jurisprudence — juridiction (ex. CJUE, Cour de cassation, JUB)"
        type: string
      - name: date_decision
        label: "Jurisprudence — date de la décision (ex. 25 juillet 2018)"
        type: string
      - name: reference
        label: "Jurisprudence — référence (n° d'affaire, parties)"
        type: string
      - name: a_retenir
        label: "Jurisprudence — points à retenir"
        type: text
        list: true
      - name: resume
        label: Résumé (affiché sur la carte de l'article et dans Google)
        type: text
      - name: lecture
        label: Temps de lecture (minutes)
        type: number
      - name: body
        label: Texte de l'article
        type: rich-text

  - name: contenu
    label: Textes du site
    type: file
    path: _data/contenu.yml
    format: yaml
    fields:
      - name: identite
        label: Identité
        type: object
        fields:
          - { name: logo, label: "Logo (laisser vide pour le logo par défaut)", type: image }
      - name: accueil
        label: Accueil
        type: object
        fields:
          - { name: surtitre, label: Petit texte au-dessus du titre, type: string }
          - { name: titre, label: Titre principal, type: string }
          - { name: accroche, label: Texte d'accroche, type: text }
          - { name: bouton_principal, label: Bouton principal, type: string }
          - { name: bouton_secondaire, label: Bouton secondaire, type: string }
          - { name: mots_cles, label: Mots-clés (pastilles), type: string, list: true }
      - name: expertise
        label: Expertise
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: services
            label: Services
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titre}"
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
              - name: icone
                label: Icône
                type: select
                options:
                  values: [document, loupe, bouclier, calendrier, cadenas, contrat, fiole, globe]
      - name: secteurs
        label: Secteurs
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - name: pharma
            label: Industrie pharmaceutique
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: intro, label: Introduction, type: text }
              - { name: points, label: Points, type: string, list: true }
          - name: cosmetique
            label: Industrie cosmétique
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: intro, label: Introduction, type: text }
              - { name: points, label: Points, type: string, list: true }
      - name: cibles
        label: Pour qui (start-up, PME, ETI)
        type: object
        fields:
          - { name: surtitre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: liste
            label: Profils
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titre}"
            fields:
              - { name: titre, label: Profil, type: string }
              - { name: texte, label: Texte, type: text }
              - { name: points, label: Points, type: string, list: true }
      - name: profil
        label: Présentation (titre et méthode)
        type: object
        fields:
          - { name: surtitre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: valeurs
            label: Valeurs
            type: object
            list: true
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
          - { name: methode_titre, label: Titre de la méthode, type: string }
          - name: etapes
            label: Étapes de la méthode
            type: object
            list: true
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
      - name: a_propos
        label: À propos
        type: object
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: fonction, label: Fonction, type: text }
          - { name: photo, label: Photo (format portrait), type: image }
          - { name: cadrage_photo, label: "Cadrage de la photo (ex. center 25%)", type: string }
          - { name: paragraphes, label: Paragraphes, type: text, list: true }
          - name: chiffres
            label: Chiffres clés
            type: object
            list: true
            fields:
              - { name: valeur, label: Valeur, type: string }
              - { name: libelle, label: Libellé, type: string }
      - name: jurisprudence
        label: Jurisprudence
        type: object
        fields:
          - { name: surtitre, label: Petit titre, type: string }
          - { name: etiquette, label: Étiquette de la carte en page d'accueil, type: string }
          - { name: titre, label: Titre de la page, type: string }
          - { name: intro, label: Introduction, type: text }
      - name: publications
        label: Publications (accueil)
        type: object
        fields:
          - { name: surtitre, label: Petit titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
      - name: ressources
        label: Ressources
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
      - name: cta
        label: Bandeau « Suivre sur LinkedIn » (avant le contact)
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }
          - { name: bouton, label: Bouton, type: string }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - { name: email, label: E-mail, type: string }
          - { name: telephone, label: Téléphone, type: string }
          - { name: linkedin, label: Lien LinkedIn, type: string }
          - { name: tally_id, label: "Identifiant du formulaire Tally (ex. mRoDv3, à la fin du lien tally.so/r/…)", type: string }
      - name: pied_de_page
        label: Pied de page
        type: object
        fields:
          - { name: description, label: Description, type: text }
          - { name: avertissement, label: Avertissement, type: text }

  - name: mentions
    label: Mentions légales
    type: file
    path: mentions-legales.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titre, type: string }
      - { name: body, label: Texte, type: rich-text }
