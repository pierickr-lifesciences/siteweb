expertise:
  titre: Un accompagnement à chaque étape du cycle de l'innovation
  intro: De la recherche amont à la mise sur le marché, des conseils concrets
    adaptés à la valorisation des innovations
  services:
    - titre: Stratégie brevets
      texte: Évaluation de la brevetabilité, stratégie de dépôt et d'extension
        internationale, gestion de portefeuille.
      icone: document
    - titre: Veille & liberté d'exploitation
      texte: Recherches d'antériorités, analyses de liberté d'exploitation (FTO) et
        veille concurrentielle ciblée.
      icone: loupe
    - titre: Marques & noms de produits
      texte: Stratégie de dépôt et surveillance des marques, protection des noms de
        gammes.
      icone: bouclier
    - titre: Cycle de vie du médicament
      texte: Certificats complémentaires de protection (CCP), extension pédiatrique,
        articulation avec les exclusivités réglementaires.
      icone: calendrier
    - titre: Savoir-faire & secrets d'affaires
      texte: Choisir entre brevet et secret pour une formule, organiser la protection
        du savoir-faire en interne.
      icone: cadenas
    - titre: Contrats & audits
      texte: Audits de portefeuille (due diligence), accords de licence, de
        confidentialité et de collaboration R&D.
      icone: contrat
    - titre: Faits marquants
      texte: A venir
      icone: globe
secteurs:
  titre: Deux industries, des enjeux de propriété intellectuelle distincts
  pharma:
    titre: Industrie pharmaceutique
    intro: Des cycles de développement longs, où chaque année de protection compte.
    points:
      - Brevets de molécules, de formulations et de seconde application
        thérapeutique
      - Prolongation de la protection par CCP
      - Analyse des risques face aux génériques et biosimilaires
      - Partenariats académiques et transfert de technologie
  cosmetique:
    titre: Industrie cosmétique
    intro: Des cycles rapides, où la marque et la formule font la différence.
    points:
      - Protection des formules, actifs et procédés
      - Stratégie de marques et de noms de gammes
      - Arbitrage brevet / secret de fabrication
      - Surveillance des contrefaçons et des copies
cibles:
  surtitre: Pour qui
  titre: Une stratégie de PI à la mesure de votre entreprise
  intro: >-
    En tant que consultant , mon objectif est d'aider les PME, ETI et Start-up à
    enclencher une approche de valorisation de leur R&D par les outils de PI et
    donc leur permettre de bénéficier de mes 30 ans d'expériences dans le
    domaine par une approche concrète et partager toute les clés pour une
    développer une PI orientée business. 

    En cas de décision de déposer, défendre un brevet, je peux proposer de
    mettre en contact avec une sélection de conseil en brevets ou marques ou
    avec des avocats spécialisés en PI ou continuer à travailler en coordination
    avec les cabinets de conseils et avocats choisis par les PME, ETI et
    start-up .
  liste:
    - titre: Start-up
      texte: Sécuriser vos premiers actifs et préparer les échanges avec les
        investisseurs.
      points:
        - Premier dépôt et stratégie de priorité
        - Audit PI en vue d'une levée de fonds
        - Contrats avec laboratoires et partenaires académiques
    - titre: PME
      texte: Structurer un portefeuille cohérent avec un budget maîtrisé.
      points:
        - Audit et hiérarchisation du portefeuille
        - Arbitrage brevet / secret de fabrication
        - Veille sur les concurrents
    - titre: ETI
      texte: Accompagner l'internationalisation et sécuriser les lancements.
      points:
        - Liberté d'exploitation avant lancement
        - Stratégie d'extension internationale
        - Licences, cessions et partenariats
a_propos:
  nom: Pierick Rousseau
  fonction: Consultant en propriété intellectuelle spécialisé dans les sciences de
    la vie.
  photo: /images/portrait.jpg
  cadrage_photo: center 10%
  paragraphes:
    - " De formation ingénieur Chimiste je me suis tourné vers le droit des
      brevets en étudiant au CEIPI puis ai passé les examens de qualifications
      de l'INPI et de l'OEB. J'ai passé l'ensemble de ma carrière dans
      l'industrie pharmaceutique et cosmétique d'abord chez Sanofi ( et
      prédécesseurs : Aventis, HMR, Roussel Uclaf) puis en tant que directeur
      propriété intellectuelle du groupe Pierre Fabre jusqu'en 2021. Depuis juin
      2023 je suis représentant au sein de la JUB ( Juridiction Unifiée des
      Brevets)"
    - En tant que consultant , mon objectif est d'aider les PME, ETI et Start-up
      à enclencher une approche de valorisation de leur R&D par les outils de PI
      et donc leur permettre de bénéficier de mes 30 ans d'expériences dans le
      domaine par une approche concrète et partager toute les clés pour une
      développer une PI orientée business.
    - "Entre 2019 et 2026, j'ai rejoint le Conseil d'administration  de l'ASPIE
      (association des spécialistes de propriété intellectuelle en entreprise)
      en tant que trésorier et me suis investi dans le dossier de la
      confidentialité des spécialistes brevets de l'industrie. Depuis 2023 je
      suis membre de l'EPI ( European Patent institute) et représentant de l'EPI
      au sein de l'IEEPI. "
    - J'ai également été membre du jury de l'examen de qualification de l'INPI
      entre 2021 et 2025 et investi depuis de nombreuses années dans le coaching
      des entreprises dans le cadre de masterclass ou de l'académie de l'INPI
    - Mon lien principal avec les académiques se concrétise par ma participation
      depuis 2021 au comité d'investissement de la SATT Aquitaine.
    - Depuis 2026 je suis "Neutrals" au sein du PMAC, organisme de médiation au
      sein de la JUB. j'exerce les fonctions de Co-médiateur et expert.
    - Enfin, j'interviens au sein des master PI de l'université d'Aix, Toulouse
      et Montpellier et master II en faculté de pharmacie de Montpellier et
      coorganise une formation annuelle au CEIPI dédié aux affaires
      réglementaires et CCP réunissant des professionnels de haut niveau dans le
      domaine de la santé
